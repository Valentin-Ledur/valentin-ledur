<!DOCTYPE html>
<html lang="fr" class="background text-white">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>

    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/menu.css">
    <link rel="stylesheet" href="style/color.css">
</head>

<body>
    <div class="grid-container">
        <!-- Menu -->
        <div id="menu-container" class="grid-menu menu-background">
            <div id="pages"></div>
        </div>
        <!-- Affichage du menu selectionné -->
        <div class="grid-body text-center">
            <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
        </div>

        <!-- Recuperation du menu -->
        <script>
            fetch('menu.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById("pages").innerHTML = data;

                    const btn = document.getElementById('menu-toggle');
                    const list = document.getElementById('menu-links');

                    if (btn && list) {
                        btn.addEventListener('click', () => {
                            list.classList.toggle('active');
                        });
                    }
                });
        </script>

        <script type='text/javascript'>
            var Module = {
                canvas: (function () {
                    var canvas = document.getElementById('canvas');
                    canvas.addEventListener("webglcontextlost", function (e) { alert('Le contexte WebGL a été perdu. Veuillez recharger la page.'); e.preventDefault(); }, false);
                    return canvas;
                })(),
                onRuntimeInitialized: function () {
                    console.log("Chargement reussi");
                }
            };
        </script>
    </div>
    <script async type="text/javascript" src="SpaceShooter.js"></script>
</body>

</html>
